backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articulos"
    label: "Artículos Legal"
    folder: "content/articulos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título del Artículo", name: "title", widget: "string"}
      - {label: "Fecha de Publicación", name: "date", widget: "datetime"}
      - {label: "Categoría", name: "category", widget: "select", options: ["Derecho Inmobiliario", "Derecho Civil", "Derecho Administrativo", "General"]}
      - {label: "Tiempo de Lectura Estimado", name: "readTime", widget: "string", default: "5 min"}
      - {label: "Resumen Breve", name: "description", widget: "text"}
      - {label: "Cuerpo del Artículo (Texto completo)", name: "body", widget: "markdown"}